worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  gzip            on;
  gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

  # ── Upstream definitions ──────────────────────────────────────────
  upstream backend {
    server backend:4000;
    keepalive 32;
  }

  upstream web {
    server web:3000;
    keepalive 32;
  }

  # ── Main server block ─────────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;

    # Increase body size for credential submission
    client_max_body_size 10M;

    # ── API: /api → backend:4000 ────────────────────────────────────
    location /api/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        '';

      # Timeouts — proof verification can take a moment
      proxy_connect_timeout 10s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;

      # CORS headers (let Express handle them, don't duplicate)
      proxy_pass_header Access-Control-Allow-Origin;
    }

    # ── Health check passthrough ─────────────────────────────────────
    location /health {
      proxy_pass         http://backend/health;
      proxy_http_version 1.1;
      proxy_set_header   Host $host;
    }

    # ── Next.js hot-reload websocket (dev only) ──────────────────────
    location /_next/webpack-hmr {
      proxy_pass         http://web;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
    }

    # ── Static Next.js assets ────────────────────────────────────────
    location /_next/ {
      proxy_pass         http://web;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_cache_valid  200 1d;
      add_header         Cache-Control "public, max-age=86400, immutable";
    }

    # ── Everything else: Next.js web app ─────────────────────────────
    location / {
      proxy_pass         http://web;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        '';

      # Forward cookies (needed for auth)
      proxy_pass_header Set-Cookie;
    }
  }
}
