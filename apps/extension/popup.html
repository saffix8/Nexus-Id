<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NexusID</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="brand">
          <span class="mark" aria-hidden="true">N</span>
          <span class="wordmark">NexusID</span>
        </div>
        <span id="status" class="status" role="status"></span>
      </header>

      <main id="view" class="view" aria-live="polite"></main>

      <footer class="footer">
        <button id="open-portal" class="link" type="button">
          Open portal
          <span id="portal-icon" aria-hidden="true"></span>
        </button>
        <span id="version" class="meta"></span>
      </footer>
    </div>
    <div id="sr-announce" class="sr-only" aria-live="assertive"></div>

    <!-- Kazuhiko Arase QR generator (MIT), exposes global qrcode() -->
    <script src="qrcode.vendor.js"></script>
    <script src="dist/popup.js"></script>
  </body>
</html>
